{{ define "main" }}
<section class="page-head">
  <div class="label">Index</div>
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="article-content">{{ . }}</div>{{ end }}
</section>
<section class="section plain-list">
  {{ range .Pages }}
  <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
  {{ end }}
</section>
{{ end }}
